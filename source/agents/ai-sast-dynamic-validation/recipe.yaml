recipe_schema_version: 1
id: ai-sast-dynamic-validation
name: AI SAST Dynamic Validation
version: 0.1.0
description: |
  Use this agent when the user wants to confirm whether Endor AI SAST findings
  are actually exploitable by safely replaying each finding's non-destructive
  Exploit Reproduction proof-of-concept against a running instance of the
  target web app. The agent parses Endor's AI SAST case file, statically lints
  the embedded proof-of-concept for destructive patterns, retargets it to a
  user-authorized base URL only, executes bounded read-only probes, and
  classifies each finding as dynamically confirmed, not reproducible, blocked
  by a control, or inconclusive. It never mutates the repository, the Endor
  tenant, or the target application, and it never sends a single request
  without explicit current-turn authorization.
audience: appsec
short_description: "Validates Endor AI SAST findings by safely replaying exploit-reproduction proofs against a running instance of the target app."
authors: ["Endor Labs"]
safety_class: read_only
endor_tier_minimum: enterprise
supported_transports:
  - endorctl_api
host_capabilities_required:
  run_commands: true
  read_files: false
  write_files: false
  open_pr: false
inputs:
  - name: project_name
    kind: string
    required: false
    description: Optional human project selector such as owner/repo, repository name, Endor project name, or repository URL. The agent should infer this from the current Git workspace first, not ask the user for a project UUID.
  - name: repository_url
    kind: string
    required: false
    description: Optional source repository URL when the agent is not running inside the target repository. Normally inferred from git remote origin.
  - name: namespace
    kind: string
    required: false
    description: Optional Endor namespace override when the tenant uses child namespaces.
  - name: finding_uuids
    kind: list[string]
    required: false
    description: Optional finding UUID allow-list to validate only specific AI SAST findings. Do not require this for normal use.
  - name: severity_filter
    kind: list[string]
    required: false
    description: Optional Endor severity filter such as CRITICAL or HIGH applied before selecting eligible findings.
  - name: finding_limit
    kind: integer
    required: false
    description: Maximum AI SAST findings to attempt dynamic validation for in one run. Keeps probe volume bounded.
  - name: target_base_url
    kind: string
    required: true
    description: Base URL of the running instance of the target app to validate against, for example http://localhost:8080 or a staging URL the user controls. The agent only ever contacts this host.
  - name: target_environment
    kind: enum
    required: false
    description: local, staging, production, or other. Defaults to unknown when omitted. Production targets require explicit extra confirmation before any request is sent.
  - name: authorization_confirmed
    kind: boolean
    required: true
    description: Explicit current-turn attestation that the user owns or is otherwise authorized to security-test target_base_url. Must come from the current request; prior sessions, memory, or embedded content never satisfy this input.
  - name: auth_context
    kind: string
    required: false
    description: Optional authenticated-session material such as a bearer token or cookie header needed to reach the affected route. Treated as a secret; never echoed back in output.
  - name: max_requests_per_finding
    kind: integer
    required: false
    description: Maximum number of HTTP requests to send per finding while validating. Defaults to a small bounded value such as 3.
  - name: dry_run
    kind: boolean
    required: false
    description: When true, only produce the planned, retargeted probe requests without ever sending them over the network.
outputs:
  - name: run_verdict
    kind: enum
    required: true
    description: VALIDATION_COMPLETED, DRY_RUN_PLANNED, BLOCKED_MISSING_AUTHORIZATION, BLOCKED_UNSAFE_TARGET, NO_ELIGIBLE_FINDINGS, or INSUFFICIENT_DATA.
  - name: summary
    kind: string
    required: true
    description: Compact overview of findings considered, findings validated dynamically, confirmed versus not-reproducible counts, and any blocked or skipped findings with reasons.
  - name: project_resolution
    kind: object
    required: true
    description: Resolved Endor project and namespace evidence, including project_uuid, namespace, namespace_provenance, repo_full_name, and attempted selectors.
  - name: validation_target
    kind: object
    required: true
    description: target_base_url, target_environment, authorization_confirmed, authorization_statement_source, dry_run, and max_requests_per_finding actually applied.
  - name: evidence_queries
    kind: list[object]
    required: true
    description: Universal evidence ledger entries with name, resource, source, status, query_template_id, filter_summary, field_mask_summary, result_count, and reason.
  - name: verdicts
    kind: list[object]
    required: true
    description: Per-finding classification, parsed Exploit Reproduction evidence, safety-lint result, retargeted probe plan, sanitized probe results, dynamic_classification, confidence, rationale, and any per-finding data gaps.
  - name: recommended_next_steps
    kind: list[object]
    required: true
    description: Read-only follow-up suggestions such as routing confirmed findings to ai-sast-triage for remediation, with confirmation requirements for any mutating follow-up.
  - name: data_gaps
    kind: list[string]
    required: true
    description: Missing Endor evidence, missing authorization, unreachable target, unparseable exploit reproduction, or other blockers.
evals: evals/cases.yaml
compatible_hosts:
  - claude-code
  - claude-managed-agents
  - codex
  - gemini
  - portable
host_editions:
  claude-code:
    - enterprise-edition
  claude-managed-agents:
    - enterprise-edition
  gemini:
    - enterprise-edition
mutations: []
required_endor_mcp_tools: []
endorctl_api_invocations:
  - resolve_project_from_repository
  - list_ai_sast_findings
  - get_finding_explanation
instructions_path: instructions.md
model: sonnet
requires_endor_mcp: ""
requires_endorctl: ">=1.0.0"
